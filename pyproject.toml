[project]
name = "rag-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nedra", email = "nedramoussa123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.2",
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
]

[project.scripts]
rag-agentic = "rag_agentic:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
